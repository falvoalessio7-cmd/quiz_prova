<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anatomia Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">Quiz Anatomia </h1>

    <div id="game">

        <!-- Barra di progresso -->
        <div id="progress-bar">
            <div id="progress"></div>
        </div>

        <!-- Punteggio -->
        <div id="score">Punteggio: 0</div>

        <!-- Contenitore del quiz -->
        <div id="quiz-box">

            <!-- Immagine (solo per domande con immagine) -->
            <img id="quiz-image" alt="quiz" style="display:none;">

            <!-- Testo della domanda (per multiple choice) -->
            <p id="question-text" style="display:none; font-size: 20px; font-weight: bold;"></p>

            <!-- Input per risposte testuali -->
            <input id="answer" type="text" placeholder="Scrivi la risposta..." autocomplete="off"style="display:none; margin-top:20px;">

            <!-- Pulsante verifica -->
            <button id="btn" onclick="checkAnswer()" style="display:none; margin-top:20px;">
                Verifica
            </button>

            <!-- Feedback -->
            <p id="feedback" style="margin-top:15px;"></p>

            <!-- Opzioni multiple -->
            <div id="options" style="display:none; margin-top:20px;"></div>

            <!-- Pulsante prossima -->
            <button id="next-btn" onclick="nextQuestion()" style="display:none; margin-top:20px;">
                Prossima
            </button>

        </div>

    </div>

    <!-- Collegamento allo script dedicato al quiz di anatomia -->
    <script src="script_anatomia.js"></script>
</body>
</html>
